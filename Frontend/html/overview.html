<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Dashboard - SmartRoster</title>
    <link rel="stylesheet" href="../css/overview.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <div class="page-header">
            <h1>Monthly Dashboard</h1>
            <div class="month-selector">
                <label>Select Month:</label>
                <select id="monthPicker" onchange="updateDashboard()">
                    <option value="2026-01">January 2026</option>
                    <option value="2026-02" selected>February 2026</option>
                    <option value="2026-03">March 2026</option>
                </select>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Duties</h3>
                <p id="totalDuties">0</p>
            </div>
            <div class="stat-card completed">
                <h3>Completed</h3>
                <p id="completedDuties">0</p>
            </div>
            <div class="stat-card pending">
                <h3>Pending</h3>
                <p id="pendingDuties">0</p>
            </div>
            <div class="stat-card skipped">
                <h3>Skipped</h3>
                <p id="skippedDuties">0</p>
            </div>
        </div>

        <div class="chart-container card">
            <h3>Performance Distribution</h3>
            <canvas id="performanceChart"></canvas>
        </div>

        <div class="card table-card">
            <h3 id="tableTitle">User-wise Performance</h3>
            <table>
                <thead>
                    <tr id="tableHeader">
                        </tr>
                </thead>
                <tbody id="overviewTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="../Javascript/overview.js"></script>
</body>
</html>
