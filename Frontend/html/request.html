<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - SmartRoster</title>
    <link rel="stylesheet" href="../css/request.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <div class="view-toggle">
            <button onclick="switchView('user')">User View</button>
            <button onclick="switchView('admin')">Admin View</button>
        </div>

        <div id="userSection" class="section">
            <div class="page-header">
                <h1>Request Skip / Swap</h1>
            </div>

            <div class="card request-form">
                <form id="requestForm">
                    <label>Select Your Duty</label>
                    <select id="userDuties" required></select>

                    <label>Request Type</label>
                    <div class="radio-group">
                        <input type="radio" name="reqType" value="Skip" checked onclick="toggleSwapUser(false)"> Skip
                        <input type="radio" name="reqType" value="Swap" onclick="toggleSwapUser(true)"> Swap
                    </div>

                    <div id="swapUserField" style="display:none; margin-top: 15px;">
                        <label>Select User to Swap With</label>
                        <select id="allUsersList"></select>
                    </div>

                    <label>Reason</label>
                    <textarea id="requestReason" rows="3" placeholder="Why do you want to skip/swap?" required></textarea>

                    <button type="submit" class="submit-btn">Submit Request</button>
                </form>
            </div>

            <div class="page-header" style="margin-top: 40px;">
                <h2>My Requests</h2>
            </div>
            <div class="card table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Duty</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="myRequestsTable"></tbody>
                </table>
            </div>
        </div>

        <div id="adminSection" class="section" style="display:none;">
            <div class="page-header">
                <h1>Manage Requests</h1>
            </div>

            <div class="card table-card">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Duty</th>
                            <th>Type</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminRequestsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../Javascript/request.js"></script>
</body>
</html>
